function mainMenu(){playing=false;callBridge('onGameStateChanged', false);$('hud').style.display='none';$('ov').style.display='flex';$('screen').innerHTML=`<div style="color:var(--c);font-size:11px;letter-spacing:3px;font-weight:900">ARMORED FLIGHT • FOUR WORLDS</div><div class="logo">STORM<span style="color:var(--c)">STRIKE</span> V4</div><p class="muted">Chiến dịch 30 level: truy đuổi lốc xoáy, hoàn thành mục tiêu, nhận thưởng và giành cúp vô địch.</p><div class="grid"><div class="it"><h3>CHIẾN DỊCH 30 LEVEL</h3><b style="color:var(--c)">LEVEL ${Math.min(30,save.level||1)}/30 ${save.trophy?'🏆 CÚP ĐÃ NHẬN':''}</b><p class="muted" style="font-size:12px">STORM CREDITS <b style="color:var(--g)">$${save.credits} · BEST ${save.best}</b></p><p class="muted" style="font-size:12px">Tổng hạ gục: ${save.totalKills}</p></div><div class="it"><h3>ĐIỀU KHIỂN</h3><p class="muted" style="font-size:12px"><b>W/S</b> tiến/lùi · <b>A/D</b> rẽ<br><b>SPACE/C</b> lên/xuống · <b>SHIFT</b> tăng tốc<br><b>Chuột trái</b> bắn · <b>E</b> hút năng lượng</p></div></div><div class="actions"><button class="p" id="st">CHỌN BẢN ĐỒ</button><button id="hg">HANGAR</button><button id="ms">NHIỆM VỤ</button><button id="sd">🔊 BẬT ÂM THANH + GIỌNG ĐỌC</button></div><p class="muted" style="font-size:11px;margin-top:12px">Mẹo: giữ SHIFT để thấy vệt lửa xanh; hút E gần lốc sẽ tạo burst năng lượng vàng.</p>`;$('st').onclick=showMaps;$('hg').onclick=showHangar;$('ms').onclick=showMissions;$('sd').onclick=()=>{initAudio();if(AC?.state==='suspended')AC.resume();speak('Chào mừng phi công StormStrike. Dùng W để tiến tới, A D để rẽ, Space để lên cao, Shift để tăng tốc, chuột trái để bắn và E để hút năng lượng lốc xoáy khi ở gần.');notify('ÂM THANH ĐÃ BẬT');};}
function showMaps(){$('ov').style.display='flex';$('screen').innerHTML=`<div style="color:var(--c);font-weight:900;letter-spacing:2px">MAP SELECT • V4</div><h2>CHỌN BẢN ĐỒ</h2><div class="grid">${MAPS.map(m=>`<div class="it mapSel ${curMapId===m.id?'on':''}" data-map="${m.id}"><div class="prev" style="display:flex;align-items:center;justify-content:center;font-size:34px;background:radial-gradient(circle at 50% 35%,#${m.hl.toString(16).padStart(6,'0')}66,transparent 55%),linear-gradient(135deg,#${m.bg.toString(16).padStart(6,'0')},#${m.gr.toString(16).padStart(6,'0')})">${({coastal:"🌊",foundry:"🏭",megacity:"🏙️",eye:"🌀"})[m.id]}</div><b>${m.n}</b><p class="muted" style="font-size:12px">${m.d}</p><small>Độ khó ${m.lv||({'coastal':1,'foundry':2,'megacity':3,'eye':4}[m.id])}/4</small></div>`).join('')}</div><div class="actions"><button id="mapBack">QUAY LẠI</button><button id="mapMission">CHỌN NHIỆM VỤ</button><button class="p" id="mapLaunch">LAUNCH</button></div>`;document.querySelectorAll('[data-map]').forEach(el=>el.onclick=()=>{curMapId=el.dataset.map;showMaps()});$('mapBack').onclick=mainMenu;$('mapMission').onclick=showMissions;$('mapLaunch').onclick=()=>{buildEnv(curMapId);startGame()};}
function showHangar(){$('ov').style.display='flex';let its=[['speed','Turbine Tuning','Tăng tốc độ tối đa',350],['heat','Thermal Shield','Giảm tích nhiệt khi bắn',300],['siphon','Siphon Amplifier','Tăng tầm hút năng lượng',275]];$('screen').innerHTML=`<div style="color:var(--c);font-weight:900;letter-spacing:2px">HANGAR</div><h2>NÂNG CẤP PHI CƠ</h2><p class="muted">Credits: <b style="color:var(--g)">$${save.credits}</b></p><div class="grid">${its.map(([id,t,d,c])=>{let cost=c+save.upgrades[id]*150;return `<div class="it"><h3>${t}</h3><p class="muted" style="font-size:12px">${d}</p><div style="font-size:11px">Cấp ${save.upgrades[id]}/5</div><div style="color:var(--g);font-weight:900;margin:6px 0">$${cost}</div><button data-buy="${id}" ${save.upgrades[id]>=5||save.credits<cost?'disabled':''}>NÂNG CẤP</button></div>`}).join('')}</div><div class="actions"><button id="bk">QUAY LẠI</button><button class="p" id="lb">LAUNCH</button></div>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let id=b.dataset.buy,base={speed:350,heat:300,siphon:275}[id],cost=base+save.upgrades[id]*150;if(save.credits>=cost&&save.upgrades[id]<5){save.credits-=cost;save.upgrades[id]++;money=save.credits;persist();showHangar();}});$('bk').onclick=mainMenu;$('lb').onclick=()=>{buildEnv(curMapId);startGame();};}
function showMissions(){$('ov').style.display='flex';$('screen').innerHTML=`<div style="color:var(--c);font-weight:900;letter-spacing:2px">MISSION CONTROL</div><h2>HỢP ĐỒNG</h2>${contracts.map((m,i)=>`<div class="it" style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0"><div><b>${m.title}</b><div class="muted" style="font-size:11px">${m.desc}</div><div style="color:var(--g);font-weight:800">Thưởng +$${m.reward} ${save.completed.includes(m.id)?'✓ ĐÃ XONG':''}</div></div><button data-m="${i}" style="${save.selected===i?'background:var(--c);color:#00202b':''}">${save.selected===i?'ĐANG CHỌN':'CHỌN'}</button></div>`).join('')}<div class="actions"><button id="bk2">QUAY LẠI</button><button class="p" id="lb2">BAY NHIỆM VỤ NÀY</button></div>`;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{save.selected=Number(b.dataset.m);mission=contracts[save.selected];persist();showMissions();});$('bk2').onclick=mainMenu;$('lb2').onclick=()=>{buildEnv(curMapId);startGame();};}
function startGame(){initAudio();if(AC?.state==='suspended')AC.resume();campaignLevel=Math.max(1,Math.min(30,Number(save.level)||1));mission=missionForLevel(campaignLevel);progress=0;done=false;elapsed=0;heat=0;over=false;score=0;kills=0;health=100;money=save.credits;vel.set(0,0,0);player.position.set(0,72,190);player.rotation.set(0,0,0);rivals.forEach(r=>{r.visible=true;r.userData.hp=3;r.position.set((Math.random()-.5)*420,58+Math.random()*30,(Math.random()-.5)*420);r.userData.shoot=1+Math.random()*2;});for(let i=bullets.length-1;i>=0;i--)remB(i);playing=true;callBridge('onGameStateChanged', true);$('hud').style.display='block';$('ov').style.display='none';speak('Level '+campaignLevel+'. '+(mission.instructions||mission.desc||'Hoàn thành mục tiêu nhiệm vụ.')+'.');notify('LEVEL '+campaignLevel+' • '+mission.title);updHUD();}
function finishGame(reason){if(!playing)return;showLevelResult(false,reason);}
function trySiphon(){if(!playing)return;let best=null,dist=Infinity;for(let t of tors){let d=Math.hypot(t.position.x-player.position.x,t.position.z-player.position.z);if(d<dist){dist=d;best=t;}}let range=65*(1+save.upgrades.siphon*.22);if(best&&dist<range){let gain=45+Math.floor(best.userData.s*30);money+=gain;score+=120;heat=Math.min(100,heat+10);if(mission.kind==='siphon'&&!done){progress++;if(progress>=mission.target)completeMission();}best.scale.setScalar(1.08);setTimeout(()=>best.scale.setScalar(1),140);spawnSiphonBurst(best.position.clone().add(new THREE.Vector3(0,22*best.userData.s,0)));tone(320,950,.55,.25,'sine');callBridge('vibrate', 40);notify('HÚT THÀNH CÔNG +$'+gain);}else notify('Bay gần lốc hơn! Cần dưới '+Math.round(range)+'m');}
function firePlayer(){if(!playing||over)return;let dir=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion),pos=player.position.clone().add(dir.clone().multiplyScalar(9));fire(pos,dir,'player');heat=Math.min(100,heat+7*getMap(curMapId).heat-save.upgrades.heat*.7);if(heat>=100)over=true;}
function hold(id,down,up=()=>{}){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture?.(e.pointerId);down();});['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,e=>{e.preventDefault();up();}));}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if([' ','arrowup','arrowdown'].includes(k))e.preventDefault();if(k==='e')trySiphon();if(k==='escape'&&playing)mainMenu();});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener('pointerdown',e=>{if(playing){firing=true;canvas.setPointerCapture?.(e.pointerId);}});addEventListener('pointerup',()=>firing=false);addEventListener('pointercancel',()=>firing=false);
hold('bUp',()=>{upHeld=true;keys['w']=true;},()=>{upHeld=false;keys['w']=false;});hold('bSi',trySiphon);hold('bFi',()=>firing=true,()=>firing=false);hold('bBo',()=>{boost=true;keys['shift']=true;},()=>{boost=false;keys['shift']=false;});
const joy=$('joy'),knob=$('knob');let joyId=null;joy.addEventListener('pointerdown',e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(e.pointerId);moveJoy(e);});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e);});function moveJoy(e){let r=joy.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),max=r.width*0.32,l=Math.hypot(x,y);if(l>max){x=x/l*max;y=y/l*max;}joyX=x/max;joyY=y/max;knob.style.left='calc(30% + '+x+'px)';knob.style.top='calc(30% + '+y+'px)';}function resetJoy(){joyId=null;joyX=joyY=0;knob.style.left='30%';knob.style.top='30%';}['pointerup','pointercancel','lostpointercapture'].forEach(n=>joy.addEventListener(n,resetJoy));
function resizeGame(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));}
addEventListener('resize',resizeGame);addEventListener('orientationchange',()=>setTimeout(resizeGame,180));
document.querySelectorAll('#mob button,#joy').forEach(el=>{el.addEventListener('contextmenu',e=>e.preventDefault());el.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});});
const clock=new THREE.Clock();let frame=0;
function update(dt){updateParticles(dt);if(!playing)return;elapsed+=dt;if(mission.kind==='time'&&!done){progress+=dt;if(progress>=mission.target)completeMission();}
 const turn=(keys['a']?1:0)-(keys['d']?1:0)-joyX,thrust=(keys['w']?1:0)-(keys['s']?1:0)-joyY,vertical=((keys[' ']||keys['arrowup']||upHeld)?1:0)-((keys['c']||keys['arrowdown'])?1:0);
 player.rotation.y+=turn*1.35*dt;let forward=new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion),maxSpeed=((keys['shift']||boost)?105:68)*(1+save.upgrades.speed*.12);vel.addScaledVector(forward,thrust*maxSpeed*dt);vel.y+=vertical*30*dt;vel.multiplyScalar(Math.pow(thrust===0?.91:.975,dt*60));vel.clampLength(0,maxSpeed);player.position.addScaledVector(vel,dt);player.position.y=THREE.MathUtils.clamp(player.position.y,3,260);player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-turn*.16,4,dt);
 if(over){heat=Math.max(0,heat-24*dt);if(heat<30)over=false;}else heat=Math.max(0,heat-(8+save.upgrades.heat*2)*dt);
 if(boost||keys['shift'])spawnBoostTrail(7);if(firing&&performance.now()-lastShot>170){firePlayer();lastShot=performance.now();}
 for(let t of tors){t.rotation.y+=t.userData.spin*dt;t.position.x+=t.userData.drift.x*getMap(curMapId).wind*dt;t.position.z+=t.userData.drift.z*getMap(curMapId).wind*dt;for(let b of t.userData.bits){b.a+=b.sp*dt;b.m.position.set(Math.cos(b.a)*b.r,b.y,Math.sin(b.a)*b.r);b.m.rotation.y=b.a;}}
 for(let i=0;i<rivals.length;i++){let r=rivals[i];if(!r.visible)continue;let to=player.position.clone().sub(r.position),d=to.length();r.rotation.y=Math.atan2(-to.x,-to.z);let rf=new THREE.Vector3(0,0,-1).applyQuaternion(r.quaternion);r.position.addScaledVector(rf,(d>85?24:8)*getMap(curMapId).rv*(1+(campaignLevel-1)*.018)*dt);r.position.y+=Math.sin(elapsed*1.6+i)*dt*4;r.userData.shoot-=dt;if(d<300&&r.userData.shoot<=0){fire(r.position.clone(),to.normalize(),'enemy');r.userData.shoot=Math.max(.55,1.5+Math.random()*1.8-(campaignLevel-1)*.025);}}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.position.addScaledVector(b.userData.dir,(b.userData.owner==='player'?190:115)*dt);b.userData.life-=dt*60;let rem=b.userData.life<=0||Math.abs(b.position.x)>1200||Math.abs(b.position.z)>1200||b.position.y< -40||b.position.y>500;
  if(!rem&&b.userData.owner==='player'){for(let r of rivals){if(r.visible&&b.position.distanceTo(r.position)<7){r.userData.hp--;rem=true;if(r.userData.hp<=0){r.visible=false;kills++;score+=250;money+=65;if(mission.kind==='kill'&&!done){progress++;if(progress>=mission.target)completeMission();}notify('ĐỐI THỦ BỊ HẠ +$65');}break;}}}
  else if(!rem&&b.userData.owner==='enemy'&&b.position.distanceTo(player.position)<7){rem=true;health-=12;callBridge('vibrate', 70);score=Math.max(0,score-15);if(health<=0){finishGame('WRECKED');return;}}
  if(rem)remB(i);}
 for(let t of tors){let d=Math.hypot(t.position.x-player.position.x,t.position.z-player.position.z);if(d<28&&Math.abs(player.position.y-15)<100)health-=(7+campaignLevel*.22)*dt;}if(health<=0){finishGame('WRECKED');return;}
 rain.position.x=player.position.x;rain.position.z=player.position.z;let a=rain.geometry.attributes.position;for(let i=0;i<rc;i++){a.array[i*3+1]-=dt*155;if(a.array[i*3+1]<0)a.array[i*3+1]=300;}a.needsUpdate=true;
 lightTimer-=dt;if(lightTimer<=0){lightTimer=5+Math.random()*8;lightning.intensity=6;thunder();}lightning.intensity=Math.max(0,lightning.intensity-dt*7);
 let target=player.position.clone().add(new THREE.Vector3(0,9,23).applyQuaternion(player.quaternion));camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.clone().add(forward.clone().multiplyScalar(18)));
 if(performance.now()-lastToast>2200)$('toast').style.display='none';if(frame++%5===0)updHUD();}
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera);}mainMenu();loop();
</script></body></html>
